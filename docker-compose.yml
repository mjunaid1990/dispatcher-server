services:
  mongo:
    image: mongo:7
    container_name: dispatcher-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: dispatcher-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/dispatcher
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
